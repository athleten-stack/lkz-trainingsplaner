<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LK Zug Trainingsplaner</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0b4fa3;--blue-d:#083b7b;--blue-l:#e8f0fb;--ink:#0f1b2d;--muted:#5d6b80;
  --bg:#f3f5f9;--card:#fff;--line:#dde3ec;--ok:#1d8a4e;--warn:#c0392b;--r:12px;
  --sh:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;letter-spacing:.2px;margin:0}
a{color:var(--blue)}
.top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-family:"Barlow Condensed";font-size:22px;font-weight:800;text-transform:uppercase}
.brand span{font-size:13px;opacity:.85}
.top .sp{flex:1}
.pill{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18)}
.top button.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
main{max-width:1280px;margin:0 auto;padding:20px 18px 60px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#b8c3d3}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.ai{background:linear-gradient(135deg,#0b4fa3,#2a7de1);border:0;color:#fff}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hdr h2{font-size:30px}
.grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gcard{padding:16px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--gc,var(--blue))}
.gcard h3{font-size:26px}
.gcard .meta{font-size:14px;color:var(--muted)}
.gcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.weeknav{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.weeknav button{border:0;background:none;padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:700}
.weeknav button:hover{background:var(--blue-l)}
.weeknav .lbl{padding:0 8px;font-weight:600;min-width:200px;text-align:center}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--r);min-height:220px;display:flex;flex-direction:column}
.day.train{border-color:#b6cbea;background:linear-gradient(#f6f9fe,#fff 60px)}
.day.today{outline:2px solid var(--blue);outline-offset:-1px}
.day .dh{padding:9px 10px 7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.day .dh b{font-family:"Barlow Condensed";font-size:19px}
.day .dh span{font-size:13px;color:var(--muted)}
.day .db{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.add{border:1px dashed #b8c3d3;background:none;border-radius:9px;padding:7px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px}
.add:hover{border-color:var(--blue);color:var(--blue)}
.sess{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;padding:8px 9px;cursor:pointer;background:#fff;text-align:left;width:100%}
.sess:hover{box-shadow:var(--sh)}
.sess .t{font-size:12px;color:var(--muted);font-weight:600}
.sess .n{font-weight:700;margin:2px 0 4px;line-height:1.2}
.sess .bl{font-size:12px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--blue-l);color:var(--blue-d)}
.chip.sel{background:var(--blue);color:#fff}
button.chip{border:1px solid transparent;cursor:pointer;font-size:13px;padding:5px 10px}
button.chip:not(.sel){background:#fff;border-color:var(--line);color:var(--ink)}
.who{font-size:11px;color:var(--muted)}
@media (max-width:980px){.week{grid-template-columns:1fr}.day{min-height:0}.weeknav .lbl{min-width:0}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,35,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mh h3{font-size:24px}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%;color:var(--ink);font-weight:500}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid #9cbcec;border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.g2,.g4{grid-template-columns:1fr 1fr}}
.block{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:170px 80px 1fr 30px;gap:8px;align-items:start;background:#fafbfd}
@media (max-width:640px){.block{grid-template-columns:1fr 80px 30px}.block textarea{grid-column:1/-1;grid-row:2}}
.block textarea{min-height:54px}
.tot{font-size:13px;color:var(--muted)}
.dayck{display:flex;gap:6px;flex-wrap:wrap}
.dayck label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:600;font-size:14px}
.dayck input{margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{background:var(--blue-l);border:1px solid #c7d8f1;border-radius:10px;padding:10px 12px;font-size:14px}
.note.warn{background:#fdf1ec;border-color:#f3cdbd}
.aiout{display:flex;flex-direction:column;gap:10px}
.aic{border:1px solid var(--line);border-radius:10px;padding:12px}
.aic h4{margin:0 0 4px;font-size:17px}
.aic ol{margin:6px 0 0;padding-left:18px;font-size:14px}
.aic li{margin-bottom:4px}
.spin{width:18px;height:18px;border:3px solid #c7d8f1;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.linkbox{display:flex;gap:6px}
.linkbox input{font-size:13px}
.sec{margin-top:30px}
.sec h3{font-size:22px;margin-bottom:10px}
.setgrid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px}
.biglogo{width:90px;height:90px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:#fff}
.biglogo img{width:100%;height:100%;object-fit:contain}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--blue);color:#fff}
.day.hol{background:#fff8e6}
.hb{font-size:12px;font-weight:700;color:#9a6700;padding:4px 10px;background:#fff1c7;border-bottom:1px solid #f4e1a6}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.month{padding:10px 10px 12px}
.month .mt{font-family:"Barlow Condensed";font-weight:700;font-size:20px;margin:0 2px 6px;color:var(--blue-d)}
.mg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.mg .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.dc{position:relative;border:1px solid transparent;background:#f6f8fb;border-radius:6px;height:32px;font-size:13px;font-weight:600;cursor:pointer;padding:0}
.dc:hover{border-color:var(--blue)}
.dc.tr{background:#e3ecf9}
.dc.ho{background:#ffe9a8;color:#6b4a00}
.dc.fr{background:#ffd3c2;color:#8a2c0d}
.dc.se{background:var(--blue);color:#fff}
.dc.se.ho,.dc.se.fr{box-shadow:inset 0 -4px 0 #f0b400}
.dc.td{outline:2px solid var(--ink);outline-offset:-2px}
.dc i{position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;border:1px solid #fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.lg{display:inline-block;width:14px;height:14px;border-radius:4px}
.lg.tr{background:#e3ecf9}.lg.ho{background:#ffe9a8}.lg.fr{background:#ffd3c2}.lg.se{background:var(--blue)}
.modal .sess{margin-bottom:0}
.hero{display:flex;gap:26px;align-items:center;padding:26px 28px;background:linear-gradient(135deg,#fff 55%,#eaf1fb);flex-wrap:wrap}
.hero-logo{width:130px;height:145px;display:grid;place-items:center;flex:none}
.hero-logo img,.hero-logo svg{width:100%;height:100%;object-fit:contain}
.hero h1{font-size:46px;font-weight:800;text-transform:uppercase;color:var(--blue);line-height:1}
.kicker{font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:4px;border-top:6px solid var(--gc);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,27,45,.12)}
.tile:focus-visible{outline:3px solid #9cbcec}
.tn{font-family:"Barlow Condensed";font-size:40px;font-weight:800;color:var(--gc);line-height:1}
.ty{font-weight:700}
.tm{font-size:14px;color:var(--muted)}
.tc{font-size:12px;font-weight:700;color:var(--blue-d);margin-top:4px}
.tgo{margin-top:10px;font-weight:700;color:var(--gc)}
.mem{font-size:13px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mchip{display:inline-flex;align-items:center;gap:3px;background:var(--blue-l);border-radius:99px;padding:2px 4px 2px 9px;font-weight:600;font-size:12px}
.mchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
.aibox{border:1px solid #c7d8f1;background:linear-gradient(135deg,#f4f8fe,#eaf1fb);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.aibox input{flex:1;min-width:0}
.tp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tp-head{display:flex;gap:14px;align-items:center;background:var(--blue);color:#fff;padding:14px 16px}
.tp-logo{width:56px;height:62px;background:#fff;border-radius:8px;display:grid;place-items:center;padding:3px;flex:none}
.tp-logo img,.tp-logo svg{width:100%;height:100%;object-fit:contain}
.tp-club{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.tp-title{font-family:"Barlow Condensed";font-size:28px;font-weight:800;line-height:1.05}
.tp-info{display:grid;grid-template-columns:1.3fr 1fr .8fr 1.6fr 1.2fr;gap:8px;padding:12px 16px;background:#f6f8fb;border-bottom:1px solid var(--line)}
.tp-info span,.tp-foot span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tp-info b{font-size:14px}
@media (max-width:640px){.tp-info{grid-template-columns:1fr 1fr}}
.tp .note{margin:10px 16px 0!important}
.tp-tab{width:100%;border-collapse:collapse;font-size:14px}
.tp-tab th{background:var(--blue-l);color:var(--blue-d);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:7px 10px}
.tp-tab td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tp-tab tbody tr:nth-child(even) td{background:#fafbfd}
.tp-tab tfoot td{font-weight:700;border-bottom:0}
.tp-tab .nw{white-space:nowrap}
.pre{white-space:pre-wrap;margin:0}
.tp-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.tp-foot>div{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:10px}
.tp-foot p{font-size:14px;margin-top:4px}
.login{max-width:420px;margin:6vh auto;padding:28px;display:flex;flex-direction:column;gap:14px}
.utab{width:100%;border-collapse:collapse;font-size:14px}
.utab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.utab td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.utab tr:last-child td{border-bottom:0}
.utab tr.off td{opacity:.55}
.pend{padding:16px;border-left:5px solid #f0b400}

/* ===== Handy / schmale Bildschirme ===== */
@media (max-width:700px){
  html,body{overflow-x:hidden;font-size:15px}
  input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{font-size:16px}
  .lg-only{display:none}
  main{padding:12px 12px 90px}
  .top .in{padding:8px 12px;gap:8px}
  .logo{width:38px;height:38px;border-radius:8px}
  .brand b{font-size:18px}
  .brand span{font-size:12px;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rolePill,#adminBtn{display:none!important}
  .top .btn.sm{padding:6px 9px;font-size:13px}
  #acctBtn{max-width:120px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
  .hdr{margin-bottom:12px}
  .hdr h2{font-size:24px}
  .hero{flex-direction:column;text-align:center;gap:10px;padding:18px}
  .hero-logo{width:84px;height:94px}
  .hero h1{font-size:30px}
  .hero .row{justify-content:center}
  .tiles{grid-template-columns:1fr;gap:10px}
  .tile{padding:14px 16px}
  .tn{font-size:32px}
  .grid-groups{grid-template-columns:1fr}
  .toolbar{gap:6px}
  .toolbar>div[style*="flex:1"]{display:none}
  .seg{order:1}
  .weeknav{order:3;width:100%;justify-content:space-between}
  .weeknav .lbl{min-width:0;font-size:14px;padding:0 4px}
  .weeknav button{padding:8px 14px;font-size:18px}
  #wToday{order:2}
  #wCopy,#wDup,#wAI{order:2;padding:8px 11px}
  #wNew{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border-radius:99px;padding:14px 20px;font-size:16px;box-shadow:0 6px 20px rgba(11,79,163,.45)}
  .week{grid-template-columns:1fr;gap:8px}
  .day{min-height:0}
  .day.nosess:not(.train):not(.today){display:none}
  .day.nosess .db{flex-direction:row}
  .day.nosess .add{flex:1}
  .day .dh{padding:8px 12px}
  .sess{padding:10px 12px}
  .sess .n{font-size:16px}
  .sess .bl{-webkit-line-clamp:2}
  .year{grid-template-columns:1fr}
  .dc{height:38px;font-size:14px}
  .legend{gap:8px;font-size:12px}
  /* Fenster als Vollbild mit fixer Kopf- und Fusszeile */
  .ov{padding:0;align-items:stretch}
  .modal{max-width:none;min-height:100%;border-radius:0;display:flex;flex-direction:column}
  .modal .mh{position:sticky;top:0;background:#fff;z-index:2;padding:12px 14px}
  .modal .mh h3{font-size:20px}
  .modal .mb{padding:14px;flex:1}
  .modal .mf{position:sticky;bottom:0;background:#fff;z-index:2;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(15,27,45,.06)}
  .modal .mf .btn{flex:1;justify-content:center;padding:11px 10px}
  .modal .mf>span{flex-basis:100%;order:-1}
  .modal .mf [style*="margin-right:auto"]{margin-right:0!important}
  .aibox .row{flex-wrap:wrap!important}
  .aibox input{flex-basis:100%}
  .aibox .btn{flex:1;justify-content:center}
  .g2{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .g4 label[style*="span 2"]{grid-column:1/-1}
  .block{grid-template-columns:1fr 70px 30px;padding:8px}
  button.chip{font-size:14px;padding:7px 11px}
  .dayck label{padding:7px 10px}
  /* Trainingsansicht: Ablauf als Karten */
  .tp-head{padding:12px}
  .tp-logo{width:44px;height:50px}
  .tp-title{font-size:22px}
  .tp-info{grid-template-columns:1fr 1fr;padding:10px 12px}
  .tp-info>div:nth-child(4){grid-column:1/-1}
  .tp-tab thead{display:none}
  .tp-tab tbody tr,.tp-tab tfoot tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tp-tab td{padding:0;border:0;background:none!important}
  .tp-tab td:nth-child(1){grid-row:1;font-weight:700}
  .tp-tab td:nth-child(1) br{display:none}
  .tp-tab td:nth-child(1) .muted::before{content:" - "}
  .tp-tab td:nth-child(2){grid-row:1}
  .tp-tab td:nth-child(3){grid-row:1;color:var(--muted)}
  .tp-tab td:nth-child(3)::after{content:" Min."}
  .tp-tab td:nth-child(4){grid-column:1/-1;margin-top:4px}
  .tp-tab tfoot td:nth-child(3)::after{content:" Min."}
  .tp-foot{grid-template-columns:1fr;padding:10px 12px}
  /* Verwaltung */
  .setgrid{grid-template-columns:1fr;justify-items:start}
  .linkbox input{min-width:0}
  .utab thead{display:none}
  .utab tr{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:3px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .utab td{padding:0;border:0}
  .utab td:nth-child(6){grid-column:2;grid-row:1/span 3;align-self:center}
  .utab td:nth-child(3),.utab td:nth-child(5){font-size:13px;color:var(--muted)}
  .login{margin:3vh auto;padding:20px}
  .toast{bottom:90px;max-width:90vw;text-align:center}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo" id="logo"></div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function monday(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromIso(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function ch(d){ return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); }
function chShort(d){ return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."; }
function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function rid(n=6){ const a="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(n)); for(const b of r) s+=a[b%a.length]; return s; }
function slug(s){ return (s||"gruppe").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,20)||"gruppe"; }

/* ---------- Firebase ---------- */
const wrapDoc = s => ({ id:s.id, exists:s.exists(), data:()=>s.data(), metadata:s.metadata });
function mkDb(fs){
  const D = p => { const r=fsDoc(fs,p); return { id:r.id, path:p, get:async()=>wrapDoc(await getDoc(r)), set:d=>setDoc(r,d), delete:()=>deleteDoc(r),
    onSnapshot:(n,e)=>fsSnap(r,s=>n(wrapDoc(s)),e) }; };
  const Q = (p,cons=[]) => ({ where:(f,o,v)=>Q(p,[...cons,where(f,o,v)]),
    onSnapshot:(n,e)=>fsSnap(query(fsCol(fs,p),...cons),s=>n({docs:s.docs.map(wrapDoc),size:s.size,empty:s.empty,metadata:s.metadata}),e),
    add:async d=>{ const r=await addDoc(fsCol(fs,p),d); return D(r.path); }, doc:id=>D(p+"/"+id) });
  return { doc:D, collection:p=>Q(p) };
}
let app, auth, fsdb, secApp;
const emailOf = u => `${String(u).trim().toLowerCase()}@${USER_DOMAIN||"lkz-planer.app"}`;
function secondaryAuth(){ if(!secApp){ secApp=initializeApp(FIREBASE_CONFIG,"secondary"); } const a=getAuth(secApp); setPersistence(a,inMemoryPersistence).catch(()=>{}); return a; }
function authErr(e){ const c=e&&e.code||""; console.warn(e);
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "Benutzername oder Passwort falsch.";
  if(/too-many-requests/.test(c)) return "Zu viele Versuche. Bitte kurz warten.";
  if(/email-already-in-use/.test(c)) return "Dieser Benutzername ist bereits vergeben.";
  if(/weak-password/.test(c)) return "Das Passwort muss mindestens 6 Zeichen haben.";
  if(/network/.test(c)) return "Keine Verbindung zum Server.";
  return "Fehler: " + (c||"unbekannt"); }

(function boot(){
  window.addEventListener("hashchange", ()=>{ if(S.profile) route(); else if(S.view==="login" && /^#invite-/.test(location.hash)) showLogin(); });
  if(!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || /^DEIN/.test(FIREBASE_CONFIG.apiKey)){
    renderHeader(); $("#app").innerHTML = `<div class="card empty"><h2>Einrichtung fehlt</h2><p>Bitte in der Datei <b>firebase-config.js</b> die Firebase-Konfiguration eintragen (siehe README).</p></div>`; return; }
  app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app); fsdb = getFirestore(app); S.db = mkDb(fsdb);
  onAuthStateChanged(auth, u => { stopSubs(); if(u) startSession(u); else showLogin(); });
})();
function stopSubs(){ S.subs.forEach(f=>{ try{ f(); }catch(e){} }); S.subs=[]; Object.values(S.gSubs||{}).forEach(f=>f()); S.gSubs={};
  setGroup(null); S.profile=null; S.owner=false; S.me=null; S.groups={}; S.groupsLoaded=false; S.usersById={}; S.config={}; S.dataStarted=false; renderHeader(); }

  const first=!setupDone;

  if(!first && inv){ showRegister(inv); return; }
  $("#app").innerHTML = `

function showPending(){
  S.view="none"; renderHeader();

function startSession(u){
  S.me=u.uid; S.view="loading"; $("#app").innerHTML=`<div class="empty"><span class="spin"></span> Laden…</div>`;
  S.subs.push(S.db.doc("users/"+u.uid).onSnapshot(s=>{
    const p = s.exists ? s.data() : null;
    if(!p && S.settingUp) return;
    if(p && p.pending && p.active!==true){ S.profile=null; showPending(); return; }
    if(!p || p.active!==true){ S.profile=null; S.view="none"; renderHeader();
      $("#app").innerHTML=`<div class="card empty"><h2>Kein Zugang</h2><p>Dein Login ist nicht (mehr) aktiv. Bitte beim Admin melden.</p><button class="btn" id="xOut">Abmelden</button></div>`;
      $("#xOut").onclick=()=>signOut(auth); return; }
    S.profile=p; S.owner = p.role==="admin"; S.myGroups = p.groups||[]; S.myLoaded=true;
    startData(); syncGroupSubs(); renderHeader();
    if(S.view==="loading" || S.view==="home" || S.view==="group" || S.view==="none") route();
  }, e=>{ console.warn(e); $("#app").innerHTML=`<div class="card empty"><h2>Kein Zugang</h2><p>Die Daten können nicht geladen werden.</p><button class="btn" id="xOut">Abmelden</button></div>`; $("#xOut").onclick=()=>signOut(auth); }));
}
function startData(){
  if(S.dataStarted) return; S.dataStarted=true;
  S.subs.push(S.db.doc("config/main").onSnapshot(s=>{ S.config = s.exists ? s.data() : {}; renderHeader(); if(S.view==="admin") renderAdmin(); if(S.view==="home") renderHome(); }, e=>console.warn(e)));
  if(S.owner) S.subs.push(S.db.doc("config/invite").onSnapshot(s=>{ S.invite = s.exists ? s.data().code : null; if(S.view==="admin") renderAdmin(); }, e=>console.warn(e)));
  S.subs.push(S.db.collection("users").onSnapshot(s=>{ S.usersById={}; s.docs.forEach(d=>S.usersById[d.id]={id:d.id,...d.data()}); if(S.view==="admin") renderAdmin(); if(S.view==="home") renderHome(); }, e=>console.warn(e)));
}
function syncGroupSubs(){
  S.gSubs = S.gSubs || {};
  if(S.owner){
    if(!S.gSubs.__all){ Object.values(S.gSubs).forEach(f=>f()); S.gSubs={};
      S.gSubs.__all = S.db.collection("groups").onSnapshot(s=>{ S.groups={}; s.docs.forEach(d=>S.groups[d.id]={id:d.id,...d.data()}); S.groupsLoaded=true; if(S.view!=="admin"||true) route(); }, e=>console.warn(e)); }
    return;
  }
  if(S.gSubs.__all){ S.gSubs.__all(); delete S.gSubs.__all; S.groups={}; }
  const want=new Set(S.myGroups||[]);
  for(const k of Object.keys(S.gSubs)) if(!want.has(k)){ S.gSubs[k](); delete S.gSubs[k]; delete S.groups[k]; }
  let pending=[...want].filter(k=>!S.gSubs[k]).length;
  if(!want.size){ S.groupsLoaded=true; }
  for(const k of want) if(!S.gSubs[k]){
    S.gSubs[k] = S.db.doc("groups/"+k).onSnapshot(s=>{ if(s.exists) S.groups[k]={id:k,...s.data()}; else delete S.groups[k];
      if(--pending<=0) S.groupsLoaded=true; route(); }, e=>{ console.warn(e); delete S.groups[k]; if(--pending<=0) S.groupsLoaded=true; route(); });
  }
}

function route(){
  if(!S.profile) return;
  const h = location.hash.replace(/^#/,"");
  if(h.startsWith("g-")){
    const id = h.slice(2);
    if(!S.groups[id]){ if(S.groupsLoaded){ S.view="none"; setGroup(null); $("#app").innerHTML=`<div class="card empty"><h2>Kein Zugriff</h2><p>Diese Gruppe gibt es nicht oder sie ist dir nicht zugeteilt. Bitte beim Admin melden.</p></div>`; renderHeader(); } return; }
    if(S.view==="group" && S.gid===id){ renderHeader(); renderGroup(); return; }
    S.view="group"; setGroup(id); renderHeader(); renderGroup(); return;
  }
  if(h==="admin" && S.owner){ S.view="admin"; setGroup(null); renderHeader(); renderAdmin(); return; }
  S.view="home"; setGroup(null); renderHeader(); renderHome();
}
function visibleGroups(){
  const all=Object.values(S.groups);
  const list = S.owner ? all : all.filter(g => (S.myGroups||[]).includes(g.id));
  return list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","de",{numeric:true}));
}
function groupUsers(gid){ return Object.values(S.usersById).filter(u=>u.active && u.role!=="admin" && (u.groups||[]).includes(gid)); }

function setGroup(id){

async function downloadBackup(){
  const b=$("#bkBtn"); b.disabled=true; b.textContent="Wird erstellt…";
  try{
    const out={ app:"LK Zug Trainingsplaner", erstellt:new Date().toISOString(), collections:{} };
    for(const c of ["config","groups","users","sessions"]){
      const s=await getDocs(fsCol(fsdb,c)); out.collections[c]={}; s.forEach(d=>{ if(!(c==="config"&&d.id==="invite")) out.collections[c][d.id]=d.data(); });
    }
    const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});

function uploadLogo(file){
  if(!file) return;
  const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => {
    const max=240, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let data=c.toDataURL("image/png"); if(data.length>180000) data=c.toDataURL("image/webp",0.85);
    URL.revokeObjectURL(url); saveConfig({logo:data});
  };
  img.onerror = () => toast("Bild konnte nicht gelesen werden");
  img.src = url;
}

function renderCal(){ if(S.mode==="year") renderYear(); else renderWeek(); }

function renderYear(){
  const box=$("#cal"); if(!box) return;
  const g=S.groups[S.gid]||{}, Y=S.year, todayIso=iso(new Date());
  $("#wLbl").textContent = `Jahr ${Y}`;
  const byDate={}; for(const s of S.sessions){ if(s.date && s.date.startsWith(String(Y))) (byDate[s.date]=byDate[s.date]||[]).push(s); }
  const total=Object.values(byDate).reduce((a,l)=>a+l.length,0);
  let html=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="legend"><span><i class="lg tr"></i>Trainingstag</span><span><i class="lg ho"></i>Schulferien Kanton Zug</span><span><i class="lg fr"></i>Schulfreier Tag</span><span><i class="lg se"></i>Training geplant</span></div><span class="muted" style="font-size:13px">${total} Training(s) im Jahr ${Y}</span></div><div class="year">`;
  for(let m=0;m<12;m++){
    const first=new Date(Y,m,1), lead=(first.getDay()+6)%7, dim=new Date(Y,m+1,0).getDate();
    html+=`<div class="month card" id="mon-${m}"><div class="mt">${MONTHS[m]}</div><div class="mg">${D2.slice(0,6).map(d=>`<div class="wd">${d}</div>`).join("")}`;
    let col=0;
    for(let i=0;i<(lead===6?0:lead);i++){ html+=`<div></div>`; col++; }
    for(let d=1; d<=dim; d++){
      const dt=new Date(Y,m,d), wd=(dt.getDay()+6)%7; if(wd===6) continue;
      if(wd===0 && d!==1){ col=0; }
      const di=iso(dt), hol=holidayOf(di), list=byDate[di]||[], tr=(g.days||[]).includes(wd);
      const cls=["dc", tr?"tr":"", hol?(hol.free?"fr":"ho"):"", list.length?"se":"", di===todayIso?"td":""].join(" ");
      const tip=[hol?hol.name:"", ...list.map(s=>`${s.time||""} ${s.title||"Training"}`)].filter(Boolean).join("\n");
      html+=`<button class="${cls}" data-day="${di}" title="${esc(tip)}">${d}${list.length?`<i style="background:${FOCUS_COLORS[(list[0].foci||[])[0]]||"#0b4fa3"}"></i>`:""}</button>`;
    }
    html+=`</div></div>`;
  }
  box.innerHTML = html+`</div>`;
  box.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>dayModal(b.dataset.day));
  if(S._yearScrolled!==Y){ S._yearScrolled=Y; const now=new Date();
    if(window.innerWidth<=700 && Y===now.getFullYear()){ const el=$("#mon-"+now.getMonth()); if(el) setTimeout(()=>el.scrollIntoView({block:"start"}),50); } }
}
function dayModal(di){
  const list=S.sessions.filter(s=>s.date===di).sort((a,b)=>(a.time||"").localeCompare(b.time||""));

  if(!list.length && !hol){ sessionModal(null,{date:di}); return; }
  openModal(`<div class="mh"><h3>${DAYS[(d.getDay()+6)%7]}, ${ch(d)}</h3><button class="x" data-close>×</button></div>
  <div class="mb">${hol?`<div class="note warn">🏖️ ${esc(hol.name)} (Kanton Zug)</div>`:""}
    ${list.length?list.map(s=>sessCard(s)).join(""):`<div class="muted">Noch kein Training an diesem Tag.</div>`}</div>

function defaultDay(){ const g=S.groups[S.gid]; const today=new Date(); const inWeek = today>=S.week && today<addDays(S.week,7); if(inWeek) return today; return addDays(S.week,(g?.days||[0])[0]||0); }
function weekSessions(){ const a=iso(S.week), b=iso(addDays(S.week,6)); return S.sessions.filter(s=>s.date>=a && s.date<=b).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)); }

  </button>`;
}

    blocks = r.blocks; drawBlocks();
    if(r.material) $("#sMat").value = r.material; if(r.notes) $("#sNotes").value = r.notes;
  };
  $("#sImp").onclick=()=>{ $("#sImpBox").hidden=false; $("#sImpTxt").focus(); };
  $("#sImpCancel").onclick=()=>{ $("#sImpBox").hidden=true; };
  $("#sImpGo").onclick=()=>{
    const r=parseAIText($("#sImpTxt").value, +$("#sDur").value||90);
    if(!r){ $("#sAIMsg").textContent="Die Antwort konnte nicht gelesen werden. Bitte die ganze Antwort von Claude einfügen."; return; }
    fillFromAI(r); $("#sImpBox").hidden=true; $("#sImpTxt").value="";
    $("#sAIMsg").textContent="Vorschlag übernommen. Bitte prüfen und anpassen, dann speichern.";
  };
  const aiBtn=$("#sAI"); if(aiBtn) aiBtn.onclick = async () => {
    const msg=$("#sAIMsg"); aiBtn.disabled=true; msg.innerHTML=`<span class="spin"></span> Die KI erstellt einen Vorschlag… (bis zu einer Minute)`;
    try{
      const r = normAI(await S.sample.json(editorPrompt(),{cache:false}), +$("#sDur").value||90);
      if(!r.blocks.length) throw {code:"invalid_json"};
      $("#sTitle").value = r.title;
      m.querySelectorAll("#sFoci .chip").forEach(c=>c.classList.toggle("sel", r.foci.includes(c.dataset.f)));
      blocks = r.blocks; drawBlocks();
      $("#sMat").value = r.material; $("#sNotes").value = r.notes;
      msg.textContent = "Vorschlag übernommen. Bitte prüfen und anpassen, dann speichern.";
    }catch(e){
      const c=e&&e.code;
      msg.textContent = (c==="not_granted"||c==="sampling_disabled") ? "Die KI ist für dein Konto hier nicht verfügbar. Nutze «Prompt kopieren»."
        : c==="rate_limited" ? "Zu viele Anfragen, bitte später nochmals versuchen." : "Kein Vorschlag erhalten. Bitte nochmals versuchen oder «Prompt kopieren» nutzen.";
    }finally{ aiBtn.disabled=false; }
  };
  $("#sSave").onclick = async () => {
    const d=collect(); if(!d.date){ toast("Bitte Datum wählen"); return; }
    $("#sSave").disabled=true;
    try{ if(ex) await S.db.doc("sessions/"+ex.id).set(d); else await S.db.collection("sessions").add(d);
      toast("Training gespeichert"); closeModal(); }catch(e){ toast(dbErr(e)); $("#sSave").disabled=false; }
  };
  if(ex){
    $("#sView").onclick=()=>viewModal(ex.id);
    const del=$("#sDel"); del.onclick = async () => {
      if(!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent="Wirklich löschen?"; return; }
      try{ await S.db.doc("sessions/"+ex.id).delete(); toast("Training gelöscht"); closeModal(); }catch(e){ toast(dbErr(e)); }
    };
    $("#sDup").onclick = async () => {
      const d=collect(); d.date=iso(addDays(fromIso(d.date),7)); d.createdBy=S.me; d.createdAt=Date.now();
      try{ await S.db.collection("sessions").add(d); toast("Kopiert auf "+ch(fromIso(d.date))); closeModal(); }catch(e){ toast(dbErr(e)); }
    };
  }
  fillNames();
}

function timeline(s){
  let [hh,mm]=(s.time||"18:00").split(":").map(Number); if(isNaN(hh)){hh=18;mm=0;}
  let t=hh*60+(mm||0); const f=x=>String(Math.floor(x/60)%24).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
  return (s.blocks||[]).map(b=>{ const a=t; t+=(+b.min||0); return {...b, from:f(a), to:f(t)}; });
}

function hexRgb(h){ const m=/^#?([0-9a-f]{6})$/i.exec(h||""); if(!m) return [11,79,163]; const n=parseInt(m[1],16); return [n>>16,(n>>8)&255,n&255]; }
function pdfSafe(t){ return String(t||"").replace(/[‘’]/g,"'").replace(/[“”„]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ€]/g,""); }
function buildPdf(s){
  const { jsPDF } = window.jspdf;
  const g=S.groups[S.gid]||{}, d=fromIso(s.date), tl=timeline(s), hol=holidayOf(s.date);
  const total=tl.reduce((a,b)=>a+(+b.min||0),0);
  const W=210, H=297, M=14, CW=W-2*M, gc=hexRgb(g.color), blue=[11,79,163];
  const render = (doc, fs, draw) => {
    const lh = fs*0.42;  // mm pro Zeile
    let y=M;
    // Kopf
    if(draw){ doc.setFillColor(...blue); doc.rect(0,0,W,34,"F"); doc.setFillColor(255,255,255); doc.roundedRect(M,5,22,24,2,2,"F");
      const logo=S.config.logo||DEFAULT_LOGO; if(logo){ try{ const fmt=/^data:image\/png/.test(logo)?"PNG":"JPEG"; doc.addImage(logo,fmt,M+1.5,6,19,22); }catch(e){} }
      doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(9);
      doc.text(pdfSafe(`${(S.config.clubName||"LK Zug").toUpperCase()}  ·  ${g.name||""}${g.years?"  ·  Jg. "+g.years:""}`), M+27, 12);
      doc.setFontSize(17); doc.text(doc.splitTextToSize(pdfSafe(s.title||"Training"), CW-27-2)[0], M+27, 21);
      doc.setFont("helvetica","normal"); doc.setFontSize(9);
      if((s.foci||[]).length) doc.text(pdfSafe("Schwerpunkte: "+s.foci.join(", ")), M+27, 28);
    }
    y=40;
    // Infozeile
    const info=[["Datum",`${DAYS[(d.getDay()+6)%7]}, ${ch(d)}`],["Zeit",`${s.time||"-"}${tl.length?" - "+tl[tl.length-1].to:""}`],["Dauer",`${s.dur||total} Min.`],["Ort",s.loc||"-"],["Leitung",s.trainer||"-"]];
    const iw=[38,28,20,58,CW-38-28-20-58];
    if(draw){ doc.setDrawColor(221,227,236); doc.setFillColor(246,248,251); doc.roundedRect(M,y,CW,14,2,2,"FD");
      let x=M+3; info.forEach(([l,v],i)=>{ doc.setFontSize(7); doc.setTextColor(93,107,128); doc.setFont("helvetica","normal"); doc.text(l.toUpperCase(),x,y+5);
        doc.setFontSize(9.5); doc.setTextColor(15,27,45); doc.setFont("helvetica","bold"); doc.text(doc.splitTextToSize(pdfSafe(v),iw[i]-3)[0],x,y+10.5); x+=iw[i]; }); }
    y+=18;
    if(hol){ if(draw){ doc.setFillColor(255,241,199); doc.roundedRect(M,y,CW,7,1.5,1.5,"F"); doc.setFontSize(8.5); doc.setTextColor(107,74,0); doc.setFont("helvetica","bold"); doc.text(pdfSafe(`${hol.name} (Kanton Zug)`),M+3,y+4.8); } y+=10; }
    // Tabelle
    const cw=[22,34,12,CW-22-34-12], pad=2.2;
    if(draw){ doc.setFillColor(232,240,251); doc.rect(M,y,CW,7,"F"); doc.setFontSize(8); doc.setFont("helvetica","bold"); doc.setTextColor(8,59,123);
      ["ZEIT","PHASE","MIN.","INHALT UND ÜBUNGEN"].forEach((t,i)=>doc.text(t, M+cw.slice(0,i).reduce((a,b)=>a+b,0)+pad, y+4.8)); }
    y+=7;
    doc.setFontSize(fs);
    tl.forEach((b,ri)=>{
      doc.setFont("helvetica","normal"); doc.setFontSize(fs);
      const lines=doc.splitTextToSize(pdfSafe(b.content||""), cw[3]-2*pad);
      doc.setFont("helvetica","bold"); const ph=doc.splitTextToSize(pdfSafe(b.phase||""), cw[1]-2*pad);
      const rh=Math.max(lines.length, ph.length, 2)*lh + 2*pad;
      if(draw){
        if(ri%2===1){ doc.setFillColor(250,251,253); doc.rect(M,y,CW,rh,"F"); }
        doc.setFillColor(...gc); doc.rect(M,y,1.2,rh,"F");
        doc.setDrawColor(221,227,236); doc.line(M,y+rh,M+CW,y+rh);
        const ty=y+pad+lh*0.8;
        doc.setTextColor(15,27,45); doc.setFont("helvetica","bold"); doc.text(b.from, M+pad+0.5, ty);
        doc.setFont("helvetica","normal"); doc.setTextColor(93,107,128); doc.text(b.to, M+pad+0.5, ty+lh);
        doc.setTextColor(15,27,45); doc.setFont("helvetica","bold"); doc.text(ph, M+cw[0]+pad, ty);
        doc.setFont("helvetica","normal"); doc.text(String(b.min||""), M+cw[0]+cw[1]+pad, ty);
        doc.text(lines, M+cw[0]+cw[1]+cw[2]+pad, ty);
      }
      y+=rh;
    });
    if(tl.length){ if(draw){ doc.setFont("helvetica","bold"); doc.setFontSize(fs); doc.setTextColor(15,27,45); doc.text("Total", M+cw[0]+pad, y+5); doc.text(String(total)+" Min.", M+cw[0]+cw[1]+pad, y+5); } y+=8; }
    // Material / Notizen
    const boxes=[["Material",s.material],["Notizen",s.notes]].filter(x=>x[1]);
    if(boxes.length){
      y+=3; const bw=boxes.length===2?(CW-4)/2:CW;
      doc.setFont("helvetica","normal"); doc.setFontSize(fs);
      const ls=boxes.map(b=>doc.splitTextToSize(pdfSafe(b[1]), bw-6));
      const bh=Math.max(...ls.map(l=>l.length))*lh+10;
      if(draw) boxes.forEach((b,i)=>{ const x=M+i*(bw+4); doc.setDrawColor(221,227,236); doc.setFillColor(246,248,251); doc.roundedRect(x,y,bw,bh,2,2,"FD");
        doc.setFontSize(7); doc.setTextColor(93,107,128); doc.setFont("helvetica","bold"); doc.text(b[0].toUpperCase(),x+3,y+5);
        doc.setFontSize(fs); doc.setTextColor(15,27,45); doc.setFont("helvetica","normal"); doc.text(ls[i],x+3,y+5+lh+1); });
      y+=bh;
    }
    if(draw){ doc.setFontSize(7); doc.setTextColor(140,150,165); doc.setFont("helvetica","normal");
      doc.text(pdfSafe(`${S.config.clubName||"LK Zug"} Trainingsplaner · erstellt am ${ch(new Date())}`), M, H-8); }
    return y;
  };
  let fs=10.5; const probe=new jsPDF({unit:"mm",format:"a4"});
  while(fs>6.5 && render(probe,fs,false) > H-14) fs-=0.5;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  doc.setProperties({title:pdfSafe(`Trainingsplan ${g.name||""} ${ch(d)}`)});
  render(doc,fs,true);
  return doc;
}
async function exportPdf(s){
  const msg=$("#pdfMsg");
  if(!window.jspdf){ msg.textContent="PDF-Modul konnte nicht geladen werden."; return; }
  const g=S.groups[S.gid]||{};
  let doc; try{ doc=buildPdf(s); }catch(e){ console.warn(e); msg.textContent="PDF konnte nicht erstellt werden."; return; }
  const name=`Trainingsplan_${slug(g.name||"gruppe").toUpperCase()}_${s.date}.pdf`;
  try{ doc.save(name); msg.textContent="PDF heruntergeladen."; }catch(e){ msg.textContent="Download nicht möglich."; }
}

/* ---------- week tools ---------- */
function weekText(){
  const g=S.groups[S.gid]||{}; const ws=weekSessions();
  let t = `${S.config.clubName||"LK Zug"} · Trainingsplan ${g.name||""}\nKW ${kw(S.week)} (${chShort(S.week)} – ${ch(addDays(S.week,6))})\n`;
  if(!ws.length) return t+"\nKeine Trainings geplant.";
  for(const s of ws){
    const d=fromIso(s.date);
    t += `\n${DAYS[(d.getDay()+6)%7]}, ${ch(d)}, ${s.time||""}${s.dur?` (${s.dur} Min.)`:""}${s.loc?`, ${s.loc}`:""}\n${s.title||"Training"}${s.trainer?` · Leitung: ${s.trainer}`:""}\n`;
    if((s.foci||[]).length) t += `Schwerpunkte: ${s.foci.join(", ")}\n`;
    for(const b of s.blocks||[]) t += `- ${b.phase}${b.min?` (${b.min} Min.)`:""}: ${b.content.replace(/\n+/g," / ")}\n`;
    if(s.material) t += `Material: ${s.material}\n`;
    if(s.notes) t += `Notizen: ${s.notes}\n`;
  }
  return t;
}
async function copyWeek(){
  const t=weekText();
  if(await copyText(t)) return;
  openModal(`<div class="mh"><h3>Woche als Text</h3><button class="x" data-close>×</button></div><div class="mb"><textarea style="min-height:320px" id="wt">${esc(t)}</textarea></div><div class="mf"><button class="btn pri" data-close>Schliessen</button></div>`);
  $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); $("#wt").select();
}
async function dupWeek(){
  const ws=weekSessions(); if(!ws.length){ toast("Diese Woche hat keine Trainings"); return; }
  const btn=$("#wDup"); if(!btn.classList.contains("armed")){ btn.classList.add("armed","danger"); btn.textContent=`${ws.length} Training(s) in KW ${kw(addDays(S.week,7))} kopieren?`; setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("armed","danger"); btn.innerHTML='⧉<span class="lg-only"> Woche duplizieren →</span>'; } },5000); return; }
  btn.disabled=true;
  try{ for(const s of ws){ const {id, ...d}=s; d.date=iso(addDays(fromIso(s.date),7)); d.createdBy=S.me; d.updatedBy=S.me; d.createdAt=d.updatedAt=Date.now(); await S.db.collection("sessions").add(d); }
    toast("Woche dupliziert"); S.week=addDays(S.week,7); renderGroup(); }catch(e){ toast(dbErr(e)); btn.disabled=false; }
}

/* ================= KI ================= */
let aiCtl=null;
function aiModal(){
  const g=S.groups[S.gid]||{};
  openModal(`
  <div class="mh"><h3>✨ KI-Vorschlag für ${esc(g.name||"die Gruppe")}</h3><button class="x" data-close>×</button></div>
  <div class="mb">
    <div class="row"><button type="button" class="chip sel" data-mode="single">Einzeltraining</button><button type="button" class="chip" data-mode="week">Ganze Woche (${esc((g.days||[]).map(i=>D2[i]).join(", ")||"Trainingstage")})</button></div>
    <label class="f">Schwerpunkte<div class="chips" id="aFoci">${FOCI.map(f=>`<button type="button" class="chip" data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div></label>
    <div class="g4">
      <label class="f" style="grid-column:span 2">Saisonphase<select id="aSeason">${SEASON.map(x=>`<option ${x===guessSeason()?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
      <label class="f">Dauer (Min.)<input type="number" id="aDur" value="${esc(g.duration||90)}" step="15"></label>
      <label class="f">Anz. Athleten<input type="number" id="aN" value="15" min="1"></label>
    </div>
    <div class="g2"><label class="f">Ort / Infrastruktur<select id="aLoc"><option>Turnhalle</option><option>Leichtathletikstadion</option><option>Stadion und Halle</option><option>Wald / Gelände</option></select></label>
      <label class="f" id="aDayWrap">Für welchen Tag<input type="date" id="aDate" value="${iso(defaultDay())}"></label></div>
    <label class="f">Weitere Wünsche<textarea id="aWish" placeholder="z. B. Vorbereitung auf den UBS Kids Cup, viel Spielformen, 2 Athleten mit Knieproblemen schonen…"></textarea></label>
    <div id="aOut" class="aiout"></div>
  </div>
  <div class="mf"><span class="muted" style="margin-right:auto;font-size:13px">Vorschläge immer fachlich prüfen.</span>
    <button class="btn" data-close>Schliessen</button><button class="btn ai" id="aGo">Vorschlag erstellen</button></div>`);
  const m=$("#modal"); let mode="single";
  m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  m.querySelectorAll("#aFoci .chip").forEach(c=>c.onclick=()=>c.classList.toggle("sel"));
  m.querySelectorAll("[data-mode]").forEach(c=>c.onclick=()=>{ mode=c.dataset.mode; m.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("sel",x===c)); $("#aDayWrap").style.visibility = mode==="single"?"visible":"hidden"; });
  $("#aGo").onclick = () => runAI(mode);
}
function singlePrompt({date,dur,loc,foci,wish}){
  const g=S.groups[S.gid]||{};
  const recent = S.sessions.filter(s=>s.date<iso(date)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4)
    .map(s=>`${ch(fromIso(s.date))}: ${s.title} (${(s.foci||[]).join(", ")})`).join("; ");
  const hol=holidayOf(iso(date));
  return `Du bist ein erfahrener Leichtathletik-Nachwuchstrainer in der Schweiz (Swiss Athletics, J+S-Grundsätze).
Erstelle einen Vorschlag für ein Training des Vereins ${S.config.clubName||"LK Zug"}, Gruppe ${g.name||"U16"}${g.years?` (Jahrgänge ${g.years})`:""}.
Datum: ${DAYS[(date.getDay()+6)%7]}, ${ch(date)}${hol?` (${hol.name}, evtl. weniger Athleten)`:""}. Dauer: ${dur} Minuten. Ort: ${loc||"nicht angegeben"}. Saisonphase: ${guessSeason(date)}.
${g.level?`Gruppenhinweise: ${g.level}\n`:""}Schwerpunkte: ${foci&&foci.length?foci.join(", "):"vielseitig, nach deiner Einschätzung"}.
${wish?`Wunsch des Trainers: ${wish}\n`:""}${recent?`Letzte Trainings (Abwechslung beachten): ${recent}\n`:""}
Regeln: altersgerecht (vielseitig, Technik vor Intensität, Kraft mit Körpergewicht oder leichten Geräten, Spielformen erlaubt), die Summe der Minuten entspricht ${dur}. STIL: rein stichwortartig, möglichst wenig Text, keine ganzen Sätze, keine Erklärungen. Beispiel für content: "Skipping · Anfersen · Hopserlauf je 2x 20 m". Titel max. 5 Wörter. Schweizer Hochdeutsch, kein ß, keine Gedankenstriche.
Antworte nur mit JSON in dieser Form: {"title": string, "foci": string[] (nur aus: ${FOCI.join(", ")}), "blocks": [{"phase": string (eines von: ${PHASES.join(", ")}), "min": number, "content": string (nur Stichworte, Übungen mit " · " getrennt, inkl. Wdh./Distanz, max. 12 Wörter)}], "material": string (Stichworte, kommagetrennt), "notes": string (max. 1 kurzer Stichwortsatz oder leer)}`;
}
function guessSeason(d){ const mo=(d||new Date()).getMonth()+1; if(mo>=9&&mo<=10) return "Grundlagen (Herbst)"; if(mo>=11||mo===12) return "Wintervorbereitung"; if(mo<=2) return "Hallensaison"; if(mo<=4) return "Vorbereitung Sommer"; if(mo<=8) return "Wettkampfsaison"; return "Grundlagen (Herbst)"; }

async function runAI(mode){
  const g=S.groups[S.gid]||{};
  const foci=[...document.querySelectorAll("#aFoci .chip.sel")].map(c=>c.dataset.f);
  const dur=+$("#aDur").value||90, n=+$("#aN").value||15;
  const tdays=(g.days||[]).map(i=>DAYS[i]);
  if(mode==="week" && !tdays.length){ toast("Für die Gruppe sind keine Trainingstage hinterlegt"); return; }
  const recent = S.sessions.filter(s=>s.date<iso(S.week)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4)
    .map(s=>`${ch(fromIso(s.date))}: ${s.title} (${(s.foci||[]).join(", ")})`).join("; ");
  const blockSchema = `{"title": string, "foci": string[] (nur aus: ${FOCI.join(", ")}), "blocks": [{"phase": string (eines von: ${PHASES.join(", ")}), "min": number, "content": string (nur Stichworte, Übungen mit " · " getrennt, inkl. Wdh./Distanz, max. 12 Wörter)}], "material": string (Stichworte, kommagetrennt), "notes": string (max. 1 kurzer Stichwortsatz oder leer)}`;
  const prompt = `Du bist ein erfahrener Leichtathletik-Nachwuchstrainer in der Schweiz (Swiss Athletics, J+S-Grundsätze).
Erstelle einen Trainingsvorschlag für den Verein ${S.config.clubName||"LK Zug"}, Gruppe ${g.name||"U16"}${g.years?` (Jahrgänge ${g.years})`:""}.
Rahmen: ca. ${n} Athletinnen und Athleten, ${dur} Minuten pro Training, Ort: ${$("#aLoc").value}, Saisonphase: ${$("#aSeason").value}.
${g.level?`Gruppenhinweise: ${g.level}\n`:""}Schwerpunkte: ${foci.length?foci.join(", "):"vielseitig, nach deiner Einschätzung"}.
${$("#aWish").value.trim()?`Wünsche der Trainer: ${$("#aWish").value.trim()}\n`:""}${recent?`Letzte Trainings (Abwechslung beachten): ${recent}\n`:""}
Regeln: altersgerecht für U16 (vielseitig, Technik vor Intensität, Kraft mit Körpergewicht oder leichten Geräten, Spielformen erlaubt), die Summe der Minuten pro Training entspricht ${dur}. STIL: rein stichwortartig, möglichst wenig Text, keine ganzen Sätze, keine Erklärungen. Beispiel für content: "Skipping · Anfersen · Hopserlauf je 2x 20 m". Titel max. 5 Wörter. Schweizer Hochdeutsch, kein ß, keine Gedankenstriche.
${mode==="week"
  ? `Plane eine Trainingswoche mit je einem Training an diesen Tagen: ${tdays.join(", ")}. Die Trainings ergänzen sich sinnvoll.
Antworte nur mit JSON: {"sessions": [{"day": string (Wochentag wie oben), ${blockSchema.slice(1)}]}`
  : `Antworte nur mit JSON in dieser Form: ${blockSchema}`}`;
  const out=$("#aOut"), go=$("#aGo");
  out.innerHTML=`<div class="note"><span class="spin"></span> Die KI erstellt den Vorschlag… (das kann bis zu einer Minute dauern) <button class="btn sm" id="aStop" style="margin-left:8px">Stopp</button></div>`;
  go.disabled=true; aiCtl=new AbortController(); $("#aStop").onclick=()=>aiCtl.abort();
  try{
    const res = await S.sample.json(prompt,{signal:aiCtl.signal, cache:false});
    let list = mode==="week" ? (res && Array.isArray(res.sessions) ? res.sessions : []) : [res];
    list = list.filter(x=>x && typeof x==="object").map(x=>normAI(x,dur));
    if(!list.length) throw {code:"invalid_json"};
    showAI(list, mode);
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled"){ out.innerHTML=""; }
    else if(c==="not_granted"||c==="sampling_disabled"){ out.innerHTML=`<div class="note warn">Die KI ist für dieses Konto nicht freigegeben.</div>`; }
    else if(c==="rate_limited"){ out.innerHTML=`<div class="note warn">Zu viele Anfragen. Bitte später nochmals versuchen.</div>`; }
    else { out.innerHTML=`<div class="note warn">Der Vorschlag konnte nicht erstellt werden. Bitte nochmals versuchen.</div>`; }
  }finally{ go.disabled=false; }
}
function parseAIText(txt, dur){
  if(!txt || !txt.trim()) return null;
  let t=txt.trim(); const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) t=fence[1];
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0 && b>a){ try{ const r=normAI(JSON.parse(t.slice(a,b+1)),dur); if(r.blocks.length) return r; }catch(e){} }
  // Fallback: Liste wie «Einlaufen (15 Min.): Joggen · ABC»
  const blocks=[]; let title="";
  for(const line of txt.split(/\n+/)){
    const l=line.replace(/[*_#>]/g,"").trim(); if(!l) continue;
    const m=l.match(/^[-•\d.)\s]*([^:(]{2,40}?)\s*\(?\s*(\d{1,3})\s*(?:min|minuten|′|')\.?\s*\)?\s*[:\-]\s*(.+)$/i);
    if(m) blocks.push({phase:m[1].trim(), min:+m[2], content:m[3].trim()});
    else if(!title && !blocks.length && l.length<70) title=l.replace(/^(titel|training)\s*:\s*/i,"");
  }
  return blocks.length ? {title:title||"Training", foci:[], blocks, material:"", notes:"", dur} : null;
}
function normAI(x,dur){
  return { day:String(x.day||""), title:String(x.title||"Training"), foci:(Array.isArray(x.foci)?x.foci:[]).map(String).filter(f=>FOCI.includes(f)),
    blocks:(Array.isArray(x.blocks)?x.blocks:[]).map(b=>({phase:String(b.phase||"Hauptteil"),min:+b.min||0,content:String(b.content||"")})),
    material:String(x.material||""), notes:String(x.notes||""), dur };
}
function showAI(list, mode){
  const out=$("#aOut");
  out.innerHTML = list.map((s,i)=>`<div class="aic">
    <div class="row" style="justify-content:space-between"><h4>${mode==="week"?esc(s.day)+": ":""}${esc(s.title)}</h4><button class="btn sm pri" data-take="${i}">Übernehmen & bearbeiten</button></div>
    <div class="chips">${s.foci.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}</div>
    <ol>${s.blocks.map(b=>`<li><b>${esc(b.phase)}</b>${b.min?` (${b.min} Min.)`:""}: ${esc(b.content)}</li>`).join("")}</ol>
    ${s.material?`<div style="font-size:13px"><b>Material:</b> ${esc(s.material)}</div>`:""}
    ${s.notes?`<div style="font-size:13px"><b>Hinweise:</b> ${esc(s.notes)}</div>`:""}
  </div>`).join("") + (mode==="week"?`<div class="row" style="justify-content:flex-end"><button class="btn pri" id="aAll">Alle ${list.length} Trainings in KW ${kw(S.week)} speichern</button></div>`:"");
  const dateFor = s => { if(mode==="single") return $("#aDate").value || iso(defaultDay()); const i=DAYS.findIndex(d=>s.day.toLowerCase().startsWith(d.toLowerCase().slice(0,2))); return iso(addDays(S.week, i<0?0:i)); };
  const g=S.groups[S.gid]||{};
  const toSess = s => ({ gid:S.gid, date:dateFor(s), time:g.time||"18:00", dur:s.dur, loc:g.location||"", trainer:"", title:s.title, foci:s.foci, blocks:s.blocks, material:s.material, notes:s.notes });
  out.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{ const s=list[+b.dataset.take]; const p=toSess(s); delete p.gid; sessionModal(null,p); });
  const all=$("#aAll"); if(all) all.onclick = async () => {
    all.disabled=true;
    try{ for(const s of list){ const d=toSess(s); d.createdBy=d.updatedBy=S.me; d.createdAt=d.updatedAt=Date.now(); await S.db.collection("sessions").add(d); }
      toast("Wochenplan gespeichert"); closeModal(); }catch(e){ toast(dbErr(e)); all.disabled=false; }
  };
}
</script>
